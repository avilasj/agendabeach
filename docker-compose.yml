services:
  db:
    image: postgres:16
    container_name: agendabeach-db
    environment:
      POSTGRES_DB: agendabeach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agendabeach"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: agendabeach-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agendabeach
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Só sobe sob demanda (perfil "test") — ver seção 2
  backend-tests:
    build:
      context: ./backend
      target: build
    container_name: agendabeach-backend-tests
    entrypoint: ["mvn", "-B", "clean", "test"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agendabeach
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

  frontend:
    build:
      context: ./frontend
    container_name: agendabeach-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
